{% extends "base.html" %}

{% block content %}

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #0b1220;
    overflow: hidden;
}

.chat-layout {
    flex: 1;
    display: flex;
    width: 100%;
    max-width: none;
    height: 100%;
    margin-top: 0;
    overflow: hidden;
    background: #0b1220;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* SIDEBAR */
.chat-sidebar {
    width: 280px;
    flex: 0 0 280px;
    background: #0f172a;
    border-right: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    padding: 16px;
    box-sizing: border-box;
}

.chat-sidebar h3 {
    margin: 0 0 12px 0;
    font-size: 13px;
    color: #94a3b8;
}

#session-count {
    color: #64748b;
}

.chat-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.check-all-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #94a3b8;
    cursor: pointer;
}

#delete-selected {
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
    background: #7f1d1d;
    color: white;
    cursor: pointer;
}

#delete-selected:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

#chat-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 4px;
}

.chat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.chat-checkbox {
    flex: 0 0 auto;
}

.chat-item {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: #cbd5e1;
    background: transparent;
    transition: 0.18s ease;
    border: 1px solid transparent;
}

.chat-item:hover {
    background: #111c31;
    transform: translateX(2px);
}

.chat-item.active-chat {
    background: #2563eb;
    color: white;
}

#new-chat {
    margin-top: 12px;
    margin-bottom: 12px;
    padding: 11px 12px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: 0.18s ease;
}

#new-chat:hover {
    background: #1d4ed8;
}

/* MAIN */
.chat-main {
    flex: 1 1 0;
    width: 100%;
    max-width: none;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.top-header {
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
    padding: 8px 16px;
    flex-shrink: 0;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.top-header h1 {
    margin: 0;
    font-size: 18px;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.model-label {
    font-size: 12px;
    color: #94a3b8;
}

.model-select {
    background: #020617;
    border: 1px solid #1e293b;
    color: #e2e8f0;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12px;
    min-width: 0;
    width: min(260px, 45vw);
    outline: none;
}

.chat-page {
    flex: 1 1 auto;
    display: flex;
    min-width: 0;
    min-height: 0;
    width: 100%;
    max-width: none;
    overflow: hidden;

    padding-right: 12px;
    box-sizing: border-box;
}

.form-card {
    flex: 1 1 auto;
    min-width: 0;
    max-width: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    width: 100%;
    background: #0b1220;
    padding: 0;
    margin: 0;
}

/* CHAT AREA */
#empty-state,
#chat-container {
    flex: 1;
    width: 100%;
    max-width: none;
    min-height: 0;
    box-sizing: border-box;
}

#empty-state {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: stretch;

    width: auto;
    max-width: none;

    margin: 8px 16px 12px 12px;
    padding: 0;

    box-sizing: border-box;
}

.empty-card {
    flex: 1;
    width: 100%;
    height: 100%;
    max-width: none;

    background: white;
    border-radius: 14px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#empty-state .icon {
    font-size: 42px;
    margin-bottom: 10px;
}

#empty-state .title {
    font-size: 20px;
    color: #e2e8f0;
    font-weight: 700;
}

#empty-state .subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
}

/* This is the white area */
#chat-container {
    flex: 1;
    display: none;
    flex-direction: column;
    gap: 14px;

    width: auto;
    max-width: none;
    margin: 8px 0 12px 12px;
    padding: 20px 28px;

    box-sizing: border-box;
    overflow-y: auto;
    overflow-x: hidden;

    background: #ffffff;
    border-radius: 14px;
}

/* message rows fill the white area */
.user-msg,
.bot-msg {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 0;
    font-size: 14px;
    line-height: 1.6;
    white-space: normal;
    word-wrap: break-word;
    align-self: stretch;
    background: transparent;
    border: none;
    box-shadow: none;
}

/* user bubble */
.user-msg {
    display: flex;
    justify-content: flex-end;
}

.user-msg::before {
    content: attr(data-text);
    display: block;
    max-width: 70%;
    background: #2563eb;
    color: white;
    padding: 12px 14px;
    border-radius: 18px 18px 4px 18px;
}

/* assistant response */
.bot-msg .markdown-body {
    max-width: 75%;
    background: #e2e8f0;
    color: #1e293b;
    padding: 12px 14px;
    border-radius: 18px 18px 18px 4px;
}

.bot-msg .markdown-body,
.bot-msg .markdown-body p,
.bot-msg .markdown-body li,
.bot-msg .markdown-body strong,
.bot-msg .markdown-body em {
    color: #1e293b;
    opacity: 1;
}

/* model label */
.msg-model {
    width: fit-content;
    max-width: 75%;
    font-size: 11px;
    color: #64748b;
    margin-bottom: 6px;
    font-weight: 600;
    opacity: 1;
}

/* markdown */
.markdown-body {
    margin: 0;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
}

.markdown-body p {
    margin: 0 0 12px;
}

.markdown-body p:last-child {
    margin-bottom: 0;
}

.markdown-body ul,
.markdown-body ol {
    margin: 8px 0 12px 22px;
    padding: 0;
}

.markdown-body li {
    margin: 5px 0;
}

.markdown-body code {
    background: #e5e7eb;
    color: #111827;
    padding: 2px 5px;
    border-radius: 5px;
}

.markdown-body pre {
    background: #111827;
    color: #e5e7eb;
    padding: 14px;
    border-radius: 12px;
    overflow-x: auto;
}

/* INPUT BAR */
#input-bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #1e293b;
    background: #0f172a;
    flex-shrink: 0;
    align-items: center;
    box-sizing: border-box;
}

#question-input {
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #0b1220;
    color: white;
    outline: none;
    font-size: 14px;
}

#question-input:focus {
    border-color: #2563eb;
}

#ask-btn{
    border: none;
    cursor: pointer;
    border-radius: 10px;
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    transition: 0.18s ease;
}

#ask-btn {
    background: #2563eb;
    color: white;
}

#ask-btn:hover {
    background: #1d4ed8;
}

/* SCROLLBAR */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 20px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

</style>

<div class="chat-layout">

    <div class="chat-sidebar">
        <h3>💬 Chats (<span id="session-count">0</span>)</h3>
    
        <button id="new-chat">➕ New Chat</button>
    
        <div class="chat-actions">
            <label class="check-all-label">
                <input type="checkbox" id="check-all-chats">
                All
            </label>
    
            <button id="delete-selected" disabled>Delete</button>
        </div>
    
        <div id="chat-list"></div>
    </div>

    <div class="chat-main">

        <div class="top-header">
            <div class="header-row">
                <h1>🤖 Ask Alfred</h1>

                <div class="header-right">
                    <span class="model-label">Model</span>

                    <select id="model-select" class="model-select">
                        <option>Loading models...</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="chat-page">
            <div class="form-card">

                <div id="empty-state">
                    <div class="empty-card">
                        <div class="icon">💬</div>
                        <div class="title">Start a conversation</div>
                        <div class="subtitle">
                            Choose a model and ask anything below
                        </div>
                    </div>
                </div>

                <div id="chat-container"></div>

                <div id="input-bar">
                    <input
                        id="question-input"
                        placeholder="Ask something..."
                        autocomplete="off"
                    />

                    <button id="ask-btn">Ask</button>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const chatContainer = document.getElementById("chat-container");
const emptyState = document.getElementById("empty-state");
const chatList = document.getElementById("chat-list");
const input = document.getElementById("question-input");
const sessionCount = document.getElementById("session-count");
const modelSelect = document.getElementById("model-select");

async function loadModels() {
    try {
        const resp = await fetch("/ollama_models?_=" + Date.now());
        const data = await resp.json();

        modelSelect.innerHTML = "";

        if (data.error) {
            modelSelect.innerHTML = `<option>${data.error}</option>`;
            return;
        }

        if (!data.models || data.models.length === 0) {
            modelSelect.innerHTML = "<option>No models found</option>";
            return;
        }

        data.models.forEach(model => {
            const opt = document.createElement("option");
            opt.value = model;
            opt.textContent = "🤖 " + model;
            modelSelect.appendChild(opt);
        });

        modelSelect.value = data.models.includes("phi4:latest")
            ? "phi4:latest"
            : data.models[0];

    } catch {
        modelSelect.innerHTML = "<option>Error loading models</option>";
    }
}

function showChat() {
    emptyState.style.display = "none";
    chatContainer.style.display = "flex";
}

function showEmpty() {
    if (chatContainer.children.length === 0) {
        chatContainer.style.display = "none";
        emptyState.style.display = "flex";
    }
}

function scrollBottom() {
    setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }, 0);
}

function renderMarkdown(text) {
    if (window.marked && window.DOMPurify) {
        return DOMPurify.sanitize(marked.parse(text || ""));
    }

    const escaped = document.createElement("div");
    escaped.textContent = text || "";
    return escaped.innerHTML;
}

function appendChat(role, text, model = null, shouldScroll = true) {
    if (chatContainer.style.display !== "flex") {
        showChat();
    }

    const div = document.createElement("div");
    div.className = role === "user" ? "user-msg" : "bot-msg";

    if (role === "bot") {
        if (model) {
            const label = document.createElement("div");
            label.className = "msg-model";
            label.textContent = "Answered by " + model;
            div.appendChild(label);
        }

        const body = document.createElement("div");
        body.className = "markdown-body";
        body.innerHTML = renderMarkdown(text);
        div.appendChild(body);
    } else {
        div.setAttribute("data-text", text || "");
    }

    chatContainer.appendChild(div);

    if (shouldScroll) {
        scrollBottom();
    }
}

function getCheckedChats() {
    return Array.from(document.querySelectorAll(".chat-checkbox:checked"))
        .map(cb => cb.value);
}

function updateDeleteButtonState() {
    document.getElementById("delete-selected").disabled =
        getCheckedChats().length === 0;
}

async function loadChats() {
    const resp = await fetch("/chat_sessions");
    const data = await resp.json();

    chatList.innerHTML = "";
    sessionCount.innerText = data.count || 0;

    document.getElementById("check-all-chats").checked = false;
    document.getElementById("delete-selected").disabled = true;

    data.sessions.forEach(chat => {
        const row = document.createElement("div");
        row.className = "chat-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "chat-checkbox";
        checkbox.value = chat.file;
        checkbox.addEventListener("change", updateDeleteButtonState);

        const div = document.createElement("div");
        div.className = "chat-item";
        div.innerText = chat.preview;

        div.onclick = async () => {
            const resp = await fetch("/switch_chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ file: chat.file })
            });

            const session = await resp.json();

            if (session.model) {
                modelSelect.value = session.model;
            }

            chatContainer.innerHTML = "";

            if (session.history.length > 0) {
                showChat();
                session.history.forEach(m => {
                    appendChat(m.role, m.content, m.model, false);
                });
                chatContainer.scrollTop = 0;
            } else {
                showEmpty();
            }

            document.querySelectorAll(".chat-item").forEach(item => {
                item.classList.remove("active-chat");
            });

            div.classList.add("active-chat");
        };

        row.appendChild(checkbox);
        row.appendChild(div);
        chatList.appendChild(row);
    });
}

document.getElementById("check-all-chats").addEventListener("change", function () {
    document.querySelectorAll(".chat-checkbox").forEach(cb => {
        cb.checked = this.checked;
    });

    updateDeleteButtonState();
});

document.getElementById("delete-selected").addEventListener("click", async () => {
    const selected = getCheckedChats();

    if (selected.length === 0) return;

    const resp = await fetch("/delete_chats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ files: selected })
    });

    const result = await resp.json();
    console.log("delete result:", result);

    chatContainer.innerHTML = "";
    showEmpty();

    document.getElementById("check-all-chats").checked = false;
    document.getElementById("delete-selected").disabled = true;

    await loadChats();
});

async function askQuestion() {
    const q = input.value.trim();

    if (!q) return;

    const model = modelSelect.value;

    appendChat("user", q);
    input.value = "";

    appendChat("bot", "Thinking...", model);

    try {
        const resp = await fetch("/ask_ollama", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                question: q,
                model: model
            })
        });

        const data = await resp.json();

        const lastMsg = chatContainer.lastElementChild;
        if (lastMsg && lastMsg.classList.contains("bot-msg")) {
            lastMsg.remove();
        }

        if (!resp.ok || data.error) {
            appendChat("bot", data.error || "Error generating response.", model);
            return;
        }

        appendChat("bot", data.answer, data.model || model);
        await loadChats();

    } catch (err) {
        const lastMsg = chatContainer.lastElementChild;
        if (lastMsg && lastMsg.classList.contains("bot-msg")) {
            lastMsg.remove();
        }

        appendChat("bot", "Error connecting to backend.", model);
    }
}

document.getElementById("ask-btn").onclick = askQuestion;

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        askQuestion();
    }
});

async function newChat() {
    await fetch("/clear_chat", { method: "POST" });

    chatContainer.innerHTML = "";
    showEmpty();
    await loadChats();
}

document.getElementById("new-chat").onclick = newChat;

async function init() {
    await loadModels();
    await loadChats();

    const resp = await fetch("/chat_history");
    const data = await resp.json();

    if (data.model) {
        modelSelect.value = data.model;
    }

    if (data.history && data.history.length > 0) {
        showChat();

        data.history.forEach(m => {
            appendChat(m.role, m.content, m.model, false);
        });

        chatContainer.scrollTop = 0;
    } else {
        showEmpty();
    }
}

window.addEventListener("DOMContentLoaded", init);
</script>

{% endblock %}
