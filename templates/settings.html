{% extends "base.html" %}

{% block content %}

<style>
    html,
    body {
        margin: 0;
        background: #0b1220;
    }

    .settings-page {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: #0b1220;
    }

    .page-header {
        padding: 20px;
        border-bottom: 1px solid #1e293b;
        background: #0f172a;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
    }

    .page-header h1 {
        margin: 0;
        font-size: 26px;
        color: #e2e8f0;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-top: 6px;
        margin-bottom: 20px;
    }

    .settings-wrapper {
        display: flex;
        justify-content: center;
        padding: 10px 20px 30px 20px;
        box-sizing: border-box;
    }

    .settings-form {
        width: 100%;
        max-width: 650px;
        box-sizing: border-box;

        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 14px;

        padding: 28px;

        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .settings-form label {
        color: #cbd5e1;
        font-size: 14px;
    }

    .settings-form input {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #1e293b;
        background: #020617;
        color: white;
        box-sizing: border-box;
    }

    .primary-btn {
        margin-top: 12px;
        padding: 14px;
        background: #2563eb;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
    }

    .primary-btn:hover {
        background: #1d4ed8;
    }

    .settings-msg {
        text-align: center;
        margin-top: 10px;
    }
</style>

<div class="settings-page">
    <div class="page-header">
        <span style="font-size: 24px;">⚙️</span>
        <h1>Recoll Settings</h1>
    </div>

    <div class="subtitle">
        🧠 Configure your search & indexing parameters
    </div>

    <div class="settings-wrapper">
        <form id="settings-form" class="settings-form">
            <label>🔎 Search Query</label>
            <input
                type="text"
                id="query"
                value="{{ (settings or {}).get('query','') }}"
                required
            >

            <label>📁 Index Directories</label>
            <input
                type="text"
                id="index_dir"
                value="{{ (settings or {}).get('index_dirs','') }}"
            >

            <label>📄 Top Documents</label>
            <input
                type="number"
                id="top_docs"
                value="{{ (settings or {}).get('top_docs',5) }}"
            >

            <label>🧠 Top Passages</label>
            <input
                type="number"
                id="top_passages"
                value="{{ (settings or {}).get('top_passages',3) }}"
            >

            <label>📏 Word Radius</label>
            <input
                type="number"
                id="word_radius"
                value="{{ (settings or {}).get('word_radius',500) }}"
            >

            <label>
                <input
                    type="checkbox"
                    id="full"
                    {% if (settings or {}).get('full') %}checked{% endif %}
                >
                🔄 Force Full Reindex
            </label>

            <button type="submit" class="primary-btn">
                🚀 Run Search
            </button>

            <div id="settings-msg" class="settings-msg"></div>
        </form>
    </div>
</div>

<script>
    const settingsForm = document.getElementById("settings-form");
    const settingsMsg = document.getElementById("settings-msg");

    settingsForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        settingsMsg.textContent = "⏳ Running Recoll indexing...";
        settingsMsg.style.color = "#94a3b8";

        const payload = {
            query: document.getElementById("query").value,
            index_dirs: document.getElementById("index_dir").value,
            top_docs: document.getElementById("top_docs").value,
            top_passages: document.getElementById("top_passages").value,
            word_radius: document.getElementById("word_radius").value,
            full: document.getElementById("full").checked
        };

        try {
            const response = await fetch("/run_search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok || data.status === "error") {
                settingsMsg.textContent =
                    "❌ " + (data.error || "Indexing failed.");

                settingsMsg.style.color = "#f87171";
                return;
            }

            settingsMsg.textContent =
                "✅ " + (data.message || "Indexing completed.");

            settingsMsg.style.color = "#4ade80";

        } catch (error) {
            console.error(error);

            settingsMsg.textContent =
                "❌ Could not connect to the backend.";

            settingsMsg.style.color = "#f87171";
        }
    });
</script>

{% endblock %}
